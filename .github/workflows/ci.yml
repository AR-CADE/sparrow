name: Sparrow CI & Headless Test Bot

on:
  push:
    branches: [ master, main, '0.*', 'release/*' ]
  pull_request:
    branches: [ master, main, '0.*', 'release/*' ]

jobs:
  test_cpp_code_style:
    name: "Check C++ code style with Uncrustify (openSUSE)"
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Uncrustify and Git
        run: |
          zypper -n in --no-recommends uncrustify git findutils ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout Sparrow repository
        uses: actions/checkout@v4

      - name: Run Uncrustify check on src/
        run: |
          git config --global --add safe.directory '*'
          git ls-files 'src/*.cpp' 'src/*.hpp' | xargs uncrustify -c uncrustify.ini --no-backup --replace
          git diff --exit-code

  build-and-test:
    name: Build & Headless UI Regression Test (openSUSE Tumbleweed)
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash


    steps:
      - name: Install Git and setup environment
        run: |
          zypper -n in --no-recommends git ca-certificates
          git config --global --add safe.directory '*'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install openSUSE system dependencies
        run: |
          git config --global --add safe.directory '*'
          zypper -n in --no-recommends \
            clang gcc gcc-c++ lld llvm meson ninja pkgconf-pkg-config \
            python3 python3-pip python3-setuptools \
            wayland-devel wayland-protocols-devel \
            libdrm-devel libgbm-devel libinput-devel \
            libxkbcommon-devel libxkbcommon-x11-devel \
            libpixman-1-0-devel Mesa-libEGL-devel Mesa-libGLESv2-devel Mesa-libGLESv3-devel \
            libdisplay-info-devel libliftoff-devel seatd-devel \
            libxcb-devel xcb-util-devel xcb-util-wm-devel xcb-util-renderutil-devel xcb-util-errors-devel \
            Mesa-libGL1 Mesa-dri glslang-devel liblcms2-devel systemd-devel hwdata \
            wlrctl weston xwayland \
            curl unzip tar xz which gzip jq

      - name: Install Flutter SDK
        run: |
          mkdir -p ~/.local/share
          curl -fsSL https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.2-stable.tar.xz | tar -xJ -C ~/.local/share
          git config --global --add safe.directory "$HOME/.local/share/flutter"
          "$HOME/.local/share/flutter/bin/flutter" precache --linux

      - name: Build Sparrow (Release)
        run: |
          export PATH="$HOME/.local/share/flutter/bin:$PATH"
          flutter --version
          ./build.sh release

      - name: Run Headless UI Test Bot (10s)
        env:
          WLR_BACKENDS: headless
          WLR_HEADLESS_OUTPUTS: 1
          LIBGL_ALWAYS_SOFTWARE: 1
          SPARROW_NO_REALTIME: 1
        run: |
          export PATH="$HOME/.local/share/flutter/bin:$PATH"
          ./tools/bot/sparrow_bot.sh --headless --duration=10

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-test-logs
          path: out/bot_test.log
