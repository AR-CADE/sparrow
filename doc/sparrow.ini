
[Theme]
wallpaper = [PATH_TO_YOUR_IMAGE] (ex. /home/username/Pictures/image.png)

[Commands]
launcher = [YOUR_LAUNCHER_APPLICATION]
terminal = [YOUR_TERMINAL_APPLICATION] (ex. alacritty or foot or kitty or weston-terminal or xterm)
logout = [YOUR_LOGOUT_APPLICATION] (ex. wayland-logout or exit)

[Services]
# Commands executed at startup by the Sparrow Process Supervisor.
# Syntax: <identifier> = [<type>:]<command>
#
# Supported types:
#   - normal (default): Executed once at startup. Not restarted when terminated.
#   - restartable: Executed at startup and supervised. Automatically respawned
#                  with exponential backoff if it exits unexpectedly or crashes.
#
# Examples:
# waybar = restartable:waybar
# mako = restartable:mako
# wallpaper = normal:swaybg -i /home/username/Pictures/image.png
#
# Sway-compatible syntax is also supported:
# exec = foot
# exec_always = waybar

[Secure-Content]
# Applications whose windows are automatically censored in screenshots
# and screen recordings (wlr-screencopy / wlr-export-dmabuf).
# Matches against xdg_toplevel app_id or window title (case-insensitive).
# Examples:
# app_id = rpcs3
# app_id = org.keepassxc.KeePassXC
# app_id = com.bitwarden.desktop
#
# Entire output displays can also be censored in screenshots and recordings:
# Examples:
# output_name = eDP-1
# output_name = HDMI-A-1

